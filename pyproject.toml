[project]
name = "onset-prototype"
version = "0.1.0"
description = "Onset: a presurgical evaluation workbench for epilepsy surgery (prototype on synthetic MNE data)"
requires-python = ">=3.11"
dependencies = ["mne>=1.7", "numpy>=1.26,<3", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8", "streamlit>=1.36"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onset"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
